name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate application version
        working-directory: .
        run: node scripts/verify-version.mjs --require-history-bump

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q backend/app

      - name: Validate migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Validate OpenAPI specification
        working-directory: backend
        run: python -c "from app.main import app; app.openapi()"

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: python -m pytest -q tests

      - name: Run enterprise E2E test
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: python -m pytest -v tests/test_enterprise_e2e.py

      - name: Audit Python dependencies
        run: python -m pip_audit -r backend/requirements.txt
